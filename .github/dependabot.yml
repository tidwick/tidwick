version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      # Majors that move together land in one PR so the lockfile never holds a mismatched pair.
      astro:
        patterns: ['astro', '@astrojs/*']
        update-types: [major]
      vitest:
        patterns: ['vitest', '@cloudflare/vitest-plugin']
        update-types: [major]
      eslint:
        patterns: ['eslint', 'typescript-eslint', '@eslint/*']
        update-types: [major]
    ignore:
      # Remove when the @astrojs/check peer range accepts TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
