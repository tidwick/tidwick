# Deploys the demo from next. Never by hand: the demo GitHub environment holds the secret CLOUDFLARE_API_TOKEN and the
# variable CLOUDFLARE_ACCOUNT_ID, with a required reviewer and a branch restriction to next. Until that environment is
# set up the job stops at the secret check below. It never runs on pull_request or in a fork.
name: deploy-demo

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_owner == 'tidwick' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.11
          cache: false
      - run: just ci
      - name: Deploy the demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::FAIL deploy-demo: the demo environment has no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable; the owner sets up the environment (required reviewer, branch next), then re-runs this job"
            exit 1
          fi
          just deploy demo
